      - "traefik.http.middlewares.ratelimit-redis-windowcounter-a.plugin.ratelimitprobe.limit=3"
      - "traefik.http.middlewares.ratelimit-redis-windowcounter-a.plugin.ratelimitprobe.window=60s"
      - "traefik.http.routers.ratelimit-redis-windowcounter-b.rule=PathPrefix(`/redis-windowcounter/b`)"
