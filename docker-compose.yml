      - "traefik.http.middlewares.ratelimit-redis-tokenbucket-b.plugin.ratelimitprobe.keyPrefix=tb"
      - "traefik.http.middlewares.ratelimit-redis-tokenbucket-b.plugin.ratelimitprobe.rate=0.1"
      - "traefik.http.middlewares.ratelimit-redis-tokenbucket-b.plugin.ratelimitprobe.burst=3"
      - "traefik.http.routers.ratelimit-redis-windowcounter-a.rule=PathPrefix(`/redis-windowcounter/a`)"
      - "traefik.http.routers.ratelimit-redis-windowcounter-a.entrypoints=web"
