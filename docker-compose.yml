name: reclaim-e2e

services:
  traefik:
    image: traefik:v3.7.11
    container_name: reclaim-e2e-traefik
    command:
      - "--log.level=DEBUG"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.constraints=Label(`com.docker.compose.project`,`reclaim-e2e`)"
      - "--entrypoints.web.address=:80"
      - "--experimental.localplugins.reclaimprobe.modulename=github.com/david-garcia-garcia/reclaimprobe"
      - "--experimental.localplugins.reclaimprobe.settings.useunsafe=false"
      - "--experimental.localplugins.simpleredisprobe.modulename=github.com/david-garcia-garcia/simpleredisprobe"
      - "--experimental.localplugins.simpleredisprobe.settings.useunsafe=false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./e2e/reclaimprobe:/plugins-local/src/github.com/david-garcia-garcia/reclaimprobe
      - ./e2e/simpleredisprobe:/plugins-local/src/github.com/david-garcia-garcia/simpleredisprobe
      - ./:/plugins-local/src/github.com/david-garcia-garcia/traefik-middleware-utilities
    ports:
      - "8000:80"
      - "8080:8080"

  whoami-a:
    image: traefik/whoami
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.reclaim-a.rule=PathPrefix(`/a`)"
      - "traefik.http.routers.reclaim-a.entrypoints=web"
      - "traefik.http.routers.reclaim-a.middlewares=reclaim-a@docker"
      - "traefik.http.services.reclaim-a.loadbalancer.server.port=80"
      - "traefik.http.middlewares.reclaim-a.plugin.reclaimprobe.key=shared"

  whoami-b:
    image: traefik/whoami
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.reclaim-b.rule=PathPrefix(`/b`)"
      - "traefik.http.routers.reclaim-b.entrypoints=web"
      - "traefik.http.routers.reclaim-b.middlewares=reclaim-b@docker"
      - "traefik.http.services.reclaim-b.loadbalancer.server.port=80"
      - "traefik.http.middlewares.reclaim-b.plugin.reclaimprobe.key=shared"

  redis:
    image: redis:7-alpine
    hostname: redis

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.40.2
    hostname: dragonfly
    ulimits:
      memlock: -1

  whoami-redis:
    image: traefik/whoami
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.simpleredis.rule=PathPrefix(`/redis`)"
      - "traefik.http.routers.simpleredis.entrypoints=web"
      - "traefik.http.routers.simpleredis.middlewares=simpleredis@docker"
      - "traefik.http.services.simpleredis.loadbalancer.server.port=80"
      - "traefik.http.middlewares.simpleredis.plugin.simpleredisprobe.host=redis:6379"

  whoami-dragonfly:
    image: traefik/whoami
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.simpleredis-dragonfly.rule=PathPrefix(`/dragonfly`)"
      - "traefik.http.routers.simpleredis-dragonfly.entrypoints=web"
      - "traefik.http.routers.simpleredis-dragonfly.middlewares=simpleredis-dragonfly@docker"
      - "traefik.http.services.simpleredis-dragonfly.loadbalancer.server.port=80"
      - "traefik.http.middlewares.simpleredis-dragonfly.plugin.simpleredisprobe.host=dragonfly:6379"

  redis-auth:
    image: redis:7-alpine
    hostname: redis-auth
    command: ["redis-server", "--requirepass", "secret"]

  dragonfly-auth:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.40.2
    hostname: dragonfly-auth
    command: ["--requirepass=secret"]
    ulimits:
      memlock: -1

  whoami-redis-wrong-password:
    image: traefik/whoami
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.simpleredis-redis-wrong-password.rule=PathPrefix(`/redis-wrong-password`)"
      - "traefik.http.routers.simpleredis-redis-wrong-password.entrypoints=web"
      - "traefik.http.routers.simpleredis-redis-wrong-password.middlewares=simpleredis-redis-wrong-password@docker"
      - "traefik.http.services.simpleredis-redis-wrong-password.loadbalancer.server.port=80"
      - "traefik.http.middlewares.simpleredis-redis-wrong-password.plugin.simpleredisprobe.host=redis-auth:6379"
      - "traefik.http.middlewares.simpleredis-redis-wrong-password.plugin.simpleredisprobe.password=wrong"

  whoami-dragonfly-wrong-password:
    image: traefik/whoami
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.simpleredis-dragonfly-wrong-password.rule=PathPrefix(`/dragonfly-wrong-password`)"
      - "traefik.http.routers.simpleredis-dragonfly-wrong-password.entrypoints=web"
      - "traefik.http.routers.simpleredis-dragonfly-wrong-password.middlewares=simpleredis-dragonfly-wrong-password@docker"
      - "traefik.http.services.simpleredis-dragonfly-wrong-password.loadbalancer.server.port=80"
      - "traefik.http.middlewares.simpleredis-dragonfly-wrong-password.plugin.simpleredisprobe.host=dragonfly-auth:6379"
      - "traefik.http.middlewares.simpleredis-dragonfly-wrong-password.plugin.simpleredisprobe.password=wrong"

  whoami-redis-database-99:
    image: traefik/whoami
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.simpleredis-redis-database-99.rule=PathPrefix(`/redis-database-99`)"
      - "traefik.http.routers.simpleredis-redis-database-99.entrypoints=web"
      - "traefik.http.routers.simpleredis-redis-database-99.middlewares=simpleredis-redis-database-99@docker"
      - "traefik.http.services.simpleredis-redis-database-99.loadbalancer.server.port=80"
      - "traefik.http.middlewares.simpleredis-redis-database-99.plugin.simpleredisprobe.host=redis:6379"
      - "traefik.http.middlewares.simpleredis-redis-database-99.plugin.simpleredisprobe.database=99"

  whoami-dragonfly-database-99:
    image: traefik/whoami
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.simpleredis-dragonfly-database-99.rule=PathPrefix(`/dragonfly-database-99`)"
      - "traefik.http.routers.simpleredis-dragonfly-database-99.entrypoints=web"
      - "traefik.http.routers.simpleredis-dragonfly-database-99.middlewares=simpleredis-dragonfly-database-99@docker"
      - "traefik.http.services.simpleredis-dragonfly-database-99.loadbalancer.server.port=80"
      - "traefik.http.middlewares.simpleredis-dragonfly-database-99.plugin.simpleredisprobe.host=dragonfly:6379"
      - "traefik.http.middlewares.simpleredis-dragonfly-database-99.plugin.simpleredisprobe.database=99"
