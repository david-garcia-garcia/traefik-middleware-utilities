      - "traefik.http.middlewares.ratelimit-redis-windowcounter-b.plugin.ratelimitprobe.host=redis:6379"
      - "traefik.http.middlewares.ratelimit-redis-windowcounter-b.plugin.ratelimitprobe.limiter=windowcounter"
      - "traefik.http.middlewares.ratelimit-redis-windowcounter-b.plugin.ratelimitprobe.keyPrefix=wc"
      - "traefik.http.middlewares.ratelimit-redis-windowcounter-b.plugin.ratelimitprobe.limit=3"
      - "traefik.http.middlewares.ratelimit-redis-windowcounter-b.plugin.ratelimitprobe.window=60s"

  # /dragonfly-tokenbucket/{a,b} and /dragonfly-windowcounter/{a,b}: two ratelimitprobe instances per limiter on one key prefix, so a
  # shared budget can only come from dragonfly.
  whoami-ratelimit-dragonfly:
