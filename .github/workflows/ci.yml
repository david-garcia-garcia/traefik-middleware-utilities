    - name: Install PowerShell and Pester
      run: |
        export DEBIAN_FRONTEND=noninteractive

        sudo apt-get update
        sudo apt-get install -y wget apt-transport-https software-properties-common

        wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"

        sudo dpkg --force-confdef --force-confold -i packages-microsoft-prod.deb

        sudo apt-get update
        sudo apt-get install -y powershell

        pwsh -c "Install-Module -Name Pester -Force -Scope CurrentUser -SkipPublisherCheck"
    - name: Run integration tests
      shell: pwsh
      run: ./Test-Integration.ps1 -SkipDockerCleanup -Suite simpleredis,ratelimit -Engine valkey
    - name: Show logs on failure
      if: failure()
      run: |
        echo "=== Traefik logs ==="
        docker compose logs traefik
        echo "=== Valkey logs ==="
        docker compose logs valkey
        echo "=== Whoami-valkey logs ==="
        docker compose logs whoami-valkey
        echo "=== Valkey-drop logs ==="
        docker compose logs valkey-drop
        echo "=== Valkey-auth logs ==="
        docker compose logs valkey-auth
        echo "=== Whoami-valkey-wrong-password logs ==="
        docker compose logs whoami-valkey-wrong-password
        echo "=== Whoami-valkey-database-99 logs ==="
        docker compose logs whoami-valkey-database-99
        echo "=== Whoami-ratelimit-valkey logs ==="
        docker compose logs whoami-ratelimit-valkey
    - name: Cleanup
      if: always()
      run: docker compose down -v
